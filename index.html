<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111720" />
    <title>NOAA Atlas</title>
    <meta name="description" content="A linked globe and graph that answers &quot;which NOAA API do I use for X?&quot;, with live weather alerts, space weather, tides and buoys straight from NOAA's public APIs." />
    <!-- Link previews (#271). Crawlers need absolute URLs, and %BASE_URL% is only a path. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NOAA Atlas" />
    <meta property="og:title" content="NOAA Atlas: which NOAA API do I use for X?" />
    <meta property="og:description" content="A linked globe and graph of NOAA's public APIs, with live weather alerts, space weather, tides and buoys." />
    <meta property="og:url" content="https://tayclark.github.io/noaa-atlas/" />
    <meta property="og:image" content="https://tayclark.github.io/noaa-atlas/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The NOAA Atlas service graph beside a globe showing live alerts and an aurora forecast" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The shell below paints before the bundle arrives (#271). The tokens in src/index.css aren't
         loaded yet, so their values are copied here; React replaces the shell on mount. -->
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body {
        background: #0a0e14;
        color: #d7e0ec;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .app-shell { display: flex; flex-direction: column; height: 100%; }
      .app-shell-header {
        display: flex;
        align-items: center;
        flex: none;
        height: 44px;
        padding: 0 1rem;
        border-bottom: 1px solid #243044;
        background: #111720;
        font-size: 0.875rem;
      }
      .app-shell-title {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .app-shell-subtitle {
        min-width: 0;
        margin-left: 0.75rem;
        overflow: hidden;
        color: #7f8ea3;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .app-shell-status, .app-noscript {
        margin: auto;
        padding: 1rem;
        color: #7f8ea3;
        font-size: 0.875rem;
        text-align: center;
      }
      .app-shell-status { animation: app-shell-pulse 1.6s ease-in-out infinite alternate; }
      .app-noscript a { color: #3ea6ff; }
      @keyframes app-shell-pulse { to { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) {
        .app-shell-status { animation: none; }
      }
      /* NARROW_LAYOUT_QUERY (useNarrowLayout.ts) held on its side: the phone layout hides its
         header there (App.css), so the shell does too. */
      @media (max-width: 700px) and (orientation: landscape), (max-height: 500px) and (pointer: coarse) and (orientation: landscape) {
        .app-shell-header { display: none; }
      }
    </style>
    <noscript><style>.app-shell-status { display: none; }</style></noscript>
  </head>
  <body>
    <div id="root">
      <div class="app-shell">
        <header class="app-shell-header">
          <span class="app-shell-title">NOAA Atlas</span>
          <span class="app-shell-subtitle">Which NOAA API do I use for X?</span>
        </header>
        <noscript>
          <p class="app-noscript">
            NOAA Atlas needs JavaScript to draw its service graph and globe. The
            <a href="https://github.com/tayclark/noaa-atlas#readme">README</a> describes every service it covers.
          </p>
        </noscript>
        <p class="app-shell-status" role="status">Loading the atlas…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
