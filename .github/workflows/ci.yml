name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          if (!fs.existsSync('coverage/coverage-summary.json')) process.exit(0);
          const t = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const rows = ['lines', 'statements', 'functions', 'branches']
            .map((k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |');
          const md = ['## Test coverage (gate: 75%)', '', '| Metric | Covered | Count |', '| --- | --- | --- |', ...rows, ''].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          "
      - run: npm run build
      - run: npm run check:budget

  # One job, because the repo has a single self-hosted runner: shards would only queue behind each
  # other. One worker: the software-rendered map and the d3 layout starve under two on this shared Mac (#273).
  e2e:
    name: e2e
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A persistent runner keeps its browsers between jobs, so this is a no-op after the first run.
      - run: npx playwright install chromium
      - run: npm run test:e2e:mocked -- --workers=1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
