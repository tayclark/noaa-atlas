name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          if (!fs.existsSync('coverage/coverage-summary.json')) process.exit(0);
          const t = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const rows = ['lines', 'statements', 'functions', 'branches']
            .map((k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |');
          const md = ['## Test coverage (gate: 75%)', '', '| Metric | Covered | Count |', '| --- | --- | --- |', ...rows, ''].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          "
      - run: npm run build
