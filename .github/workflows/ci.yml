name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          if (!fs.existsSync('coverage/coverage-summary.json')) process.exit(0);
          const t = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const rows = ['lines', 'statements', 'functions', 'branches']
            .map((k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |');
          const md = ['## Test coverage (gate: 75%)', '', '| Metric | Covered | Count |', '| --- | --- | --- |', ...rows, ''].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          "
      - run: npm run build
      - run: npm run check:budget

  # The mocked suite is split into three shards (#273). The repo has one self-hosted runner, so
  # they run one after another rather than in parallel.
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/3
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A persistent runner keeps its browsers between jobs, so this is a no-op after the first run.
      - run: npx playwright install chromium
      # The CLI reporters replace the config's, so live-e2e.yml keeps its HTML report.
      - run: npm run test:e2e:mocked -- --shard=${{ matrix.shard }}/3 --reporter=list,github,blob
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # One stable `e2e` check for branch protection. It always runs, because a skipped required
  # job counts as passing, and on failure it merges the shards' blobs into one HTML report.
  e2e:
    name: e2e
    needs: e2e-shard
    if: always()
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        if: needs.e2e-shard.result != 'success'
      - uses: actions/setup-node@v7
        if: needs.e2e-shard.result != 'success'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: needs.e2e-shard.result != 'success'
        run: npm ci
      - uses: actions/download-artifact@v8
        if: needs.e2e-shard.result != 'success'
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: all-blob-reports
      - if: needs.e2e-shard.result != 'success'
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        if: needs.e2e-shard.result != 'success'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Check shard results
        run: test "${{ needs.e2e-shard.result }}" = success
