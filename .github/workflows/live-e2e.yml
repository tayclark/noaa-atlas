name: Live e2e

# The `@live` specs hit the real NWS, SWPC, CO-OPS, nowCOAST and ArcGIS servers, so an outage on
# their side would fail CI for unchanged code. They run here, on demand only, instead of on
# every PR (#268). Nothing requires this check, so a red run is visible but blocks no merge.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-e2e
  cancel-in-progress: true

jobs:
  live-e2e:
    name: live-e2e
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A persistent runner keeps its browsers between jobs, so this is a no-op after the first run.
      - run: npx playwright install chromium
      - run: npm run test:e2e:live
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-live
          path: playwright-report/
          retention-days: 7
